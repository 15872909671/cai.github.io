<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>写作 · CAI</title><link rel="stylesheet" href="./styles.css?v=online-20261001"><link rel="stylesheet" href="./admin.css?v=online-20261001"><script defer src="./cloud-config.js?v=online-20261001"></script><script defer src="./cloud.js?v=online-20261001"></script><script defer src="./markdown.js?v=online-20261001"></script><script defer src="./admin.js?v=online-20261001"></script></head>
<body><header class="writer-header"><a href="./index.html">CAI / 返回网站</a><strong>写作</strong><button id="logout" hidden>退出登录</button></header>
<main class="writer"><p id="status" role="status" aria-live="polite"></p>
<form id="login" class="login-panel"><h1>作者登录</h1><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="button" type="submit">登录</button><p>使用博客作者账号登录。</p></form>
<section id="workspace" hidden><div class="writer-grid"><aside class="writer-files"><label>栏目<select id="collection"><option value="knowledge">技术博客</option><option value="projects">作品集合</option><option value="interviews">面试经历</option><option value="essays">随笔</option></select></label><label>当前文件夹<select id="folder"></select></label><div class="writer-tools"><button id="new-folder">新建文件夹</button><button id="new-post">新建帖子</button></div><div id="post-list"></div></aside>
<section class="editor"><form id="post-form"><label>标题<input id="title" maxlength="200" required placeholder="帖子标题"></label><label>摘要（可不填）<input id="summary" maxlength="500"></label><div class="editor-tabs"><button type="button" id="edit-tab" aria-pressed="true">编辑</button><button type="button" id="preview-tab" aria-pressed="false">预览</button><span id="post-state">新帖子</span></div><label id="body-label" for="body">正文 · Markdown</label><textarea id="body" maxlength="200000" spellcheck="false" placeholder="## 标题&#10;&#10;在这里开始写作……"></textarea><div id="preview" class="article-body" hidden></div><p class="editor-help">支持标题、段落、列表、粗体、链接与代码块。文件夹名称公开，草稿正文仅作者可见。</p><div class="editor-actions"><button type="button" id="draft">保存草稿</button><button type="submit" class="button" id="publish">发布帖子</button><button type="button" id="download">下载 Markdown</button></div></form></section></div></section></main>
<dialog id="folder-dialog"><form id="folder-form"><h2>新建文件夹</h2><label>文件夹名称<input id="folder-name" maxlength="100" required></label><div class="editor-actions"><button type="submit" class="button">创建</button><button type="button" id="folder-cancel">取消</button></div></form></dialog></body></html>
